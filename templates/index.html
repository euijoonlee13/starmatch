<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8" />
  <title>{{ t(lang, "title") }}</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2c2c54);
      color: #fff;
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      color: #333;
      padding: 32px 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .lang {
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .lang a {
      color: #6c5ce7;
      text-decoration: none;
      margin: 0 6px;
    }

    label {
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    small {
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #5a4bdc;
    }

    .error {
      color: red;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>{{ t(lang, "title") }}</h1>

    <div class="lang">
      <a href="/lang/en">English</a> |
      <a href="/lang/de">Deutsch</a> |
      <a href="/lang/ko">한국어</a>
    </div>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <label>{{ t(lang, "your_name") }}</label>
      <input name="name" required />

      <label>{{ t(lang, "your_birth") }}</label>
      <input name="birth" type="date" required />
      <small style="color: gray;">
        {{ t(lang, "birth_notice") }}
      </small>

      <button type="submit">
        {{ t(lang, "submit") }}
      </button>
    </form>

  </div>

</body>
</html>
